name: plano-studio
services:
  studio:
    build: .
    image: plano-studio:local
    container_name: plano-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      # Opcionais: chaves e logins também podem ser configurados pela tela de Ajustes.
      - ANTHROPIC_API_KEY
      - CLAUDE_CODE_OAUTH_TOKEN
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - ELEVENLABS_API_KEY
      - COMPOSIO_API_KEY
    volumes:
      - studio-data:/data
      - claude-auth:/home/node/.claude-auth
      - codex-auth:/home/node/.codex
      - whisper-models:/home/node/.cache/hyperframes/whisper
      # Pasta do Windows ao lado do .bat: projetos e MP4 feitos pelo "Claude de Video.bat".
      - ./videos:/home/node/videos
volumes:
  studio-data:
  claude-auth:
  codex-auth:
  whisper-models:
